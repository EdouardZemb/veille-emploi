<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veille emploi</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#11151c">
<link rel="stylesheet" href="/static/style.css?v={{ v_css }}">
</head>
<body data-seuil="{{ seuil_interessant }}" data-vapid="{{ cle_vapid }}"
      data-etat-demande="{{ etat_demande or '' }}"
      data-atout='{{ atout_mis_en_avant|tojson }}'>

<!-- La barre et les onglets collent ensemble en haut de l'écran : les onglets
     suivent la hauteur réelle de la barre, sans décalage écrit à la main. La barre ne
     garde que le titre : « Notifications » et « Quitter » sont dans Réglages (E11). -->
<div class="entete">
<header class="barre">
  <h1>Veille emploi</h1>
</header>

<nav class="onglets">
  <button class="onglet actif" data-vue="a-faire">À faire</button>
  <button class="onglet" data-vue="candidatures">Candidatures</button>
  <button class="onglet" data-vue="plus">Plus <span id="pastille-plus" class="pastille"></span></button>
</nav>
</div>

{% if sert_l_exemple %}
<!-- Une console sans conteneur ni configuration désignée : un oubli de VEILLE_CONFIG. Elle
     sert les critères et les gabarits de l'exemple, et refuse la collecte, les dossiers, les
     relances, le recalcul d'une offre et l'affinement. -->
<p class="avert grave bandeau" role="alert">
  Cette console sert l'exemple, pas ta configuration : pose <code>VEILLE_CONFIG</code> sur le
  serveur, puis redémarre la console.
</p>
{% endif %}

<!-- ------------------------------------------------------------------ -->
<!-- La file (ADR-0003, § 3) : ce qui attend un geste, les offres à voir au-dessus
     du seuil, puis celles remises à plus tard. La console s'ouvre ici. -->
<section id="vue-a-faire" class="vue">
  <div id="contenu-a-faire"></div>
</section>

<!-- ------------------------------------------------------------------ -->
<!-- Les candidatures en cours (ADR-0003, § 4) : Je postule, Envoyée, Entretien. Une
     ligne ouvre la fiche de l'offre ; les candidatures closes n'y sont pas. -->
<section id="vue-candidatures" class="vue cachee">
  <div id="contenu-candidatures"></div>
</section>

<!-- ------------------------------------------------------------------ -->
<!-- « Plus » mène aux écrans qui ne servent pas chaque jour (ADR-0003, § 6). Chacun commence
     par « ‹ Plus ». « Chercher une offre » ouvre Toutes les offres, le curseur dans la
     recherche (décision 5 du plan du lot 3). La pastille de l'onglet et celle de « Mes
     critères » comptent les offres à classer ; celle du « Bilan », les archivées nouvelles. -->
<section id="vue-plus" class="vue cachee">
  <nav class="liste-plus" aria-label="Les autres écrans">
    <button class="lien-plus" data-vue="offres" data-chercher>Chercher une offre</button>
    <button class="lien-plus" data-vue="offres">Toutes les offres</button>
    <button class="lien-plus" data-vue="criteres">Mes critères <span id="pastille-criteres" class="pastille"></span></button>
    <button class="lien-plus" data-vue="bilan">Bilan <span id="pastille-bilan" class="pastille"></span></button>
    <button class="lien-plus" data-vue="documents">Documents</button>
    <button class="lien-plus" data-vue="reglages">Réglages</button>
  </nav>
</section>

<!-- ------------------------------------------------------------------ -->
<!-- Toutes les offres (décisions 2 à 6 du plan du lot 3) : trois filtres toujours visibles, la
     recherche, l'état et la famille, puis la bascule de l'atout mis en avant. Les valeurs de
     l'état sont celles de `etats.ETATS_FILTRABLES` ; sans état, la liste montre les offres en
     cours. Le résumé dit le vrai nombre et nomme les filtres actifs ; chaque offre est une
     ligne qui ouvre sa fiche. -->
<section id="vue-offres" class="vue cachee">
  <button class="retour-plus" data-vue="plus">‹ Plus</button>
  <div class="filtres">
    <input type="search" id="f-recherche" aria-label="Chercher une offre"
           placeholder="Intitulé, employeur, lieu…">
    <select id="f-etat" aria-label="État">
      <option value="">En cours</option>
      <option value="a_voir">À voir</option>
      <option value="je_postule">Je postule</option>
      <option value="envoyee">Envoyée</option>
      <option value="entretien">Entretien</option>
      <option value="close">Close</option>
      <option value="mise_de_cote">Mises de côté</option>
    </select>
    <select id="f-famille" aria-label="Famille">
      <option value="">Toutes les familles</option>
      {% for cle, libelle in familles.items() %}<option value="{{ cle }}">{{ libelle }}</option>{% endfor %}
    </select>
    <button id="btn-atout" class="discret bascule" aria-pressed="false"{% if not atout_mis_en_avant %} hidden{% endif %}
            title="{{ atout_mis_en_avant.bouton_titre if atout_mis_en_avant }}">
      {{ atout_mis_en_avant.bouton if atout_mis_en_avant }}
    </button>
  </div>
  <p id="resume-offres" class="resume"></p>
  <div id="liste-offres" class="liste"></div>
</section>

<!-- ------------------------------------------------------------------ -->
<!-- Mes critères (décision 10 du plan du lot 3) : les offres à classer, le recalcul des
     scores, et le rappel que les critères se changent dans la configuration de l'instance. -->
<section id="vue-criteres" class="vue cachee">
  <button class="retour-plus" data-vue="plus">‹ Plus</button>
  <div id="contenu-criteres"></div>
</section>

<!-- ------------------------------------------------------------------ -->
<!-- Le Bilan (décisions 7 et 8) : l'entonnoir et ses tableaux, puis trois listes repliées,
     les archivées, les closes et les mises de côté. L'archive ne supprime rien. -->
<section id="vue-bilan" class="vue cachee">
  <button class="retour-plus" data-vue="plus">‹ Plus</button>
  <div id="contenu-bilan"></div>
</section>

<!-- ------------------------------------------------------------------ -->
<section id="vue-documents" class="vue cachee">
  <button class="retour-plus" data-vue="plus">‹ Plus</button>
  <p class="resume">Tes pièces de candidature et les dossiers déjà générés.
    Tout est derrière ta connexion, comme le reste.</p>
  <div id="contenu-documents"></div>
</section>

<!-- ------------------------------------------------------------------ -->
<!-- Réglages (décision 11 du plan du lot 3) : « Notifications » en tête, ce que reçoit cet
     appareil et le bouton, puis ce que `chargerReglages` réécrit, puis « Quitter » au pied.
     Les deux blocs sont écrits ici : « Quitter » marche même si `/api/reglages` échoue. Le
     libellé du bouton et la phrase de `#etat-push` suivent l'état du push de cet appareil
     (`afficherEtatPush`, app.js). -->
<section id="vue-reglages" class="vue cachee">
  <button class="retour-plus" data-vue="plus">‹ Plus</button>
  <div id="bloc-notifications" class="bloc">
    <h2>Notifications</h2>
    <p id="etat-push" class="resume"></p>
    <div class="actions">
      <button id="btn-push">Activer les notifications</button>
    </div>
  </div>
  <div id="contenu-reglages"></div>
  <div id="bloc-quitter" class="bloc">
    <form action="/deconnexion" method="post">
      <button class="discret" type="submit">Quitter</button>
    </form>
  </div>
</section>

<!-- Fenetre de detail ------------------------------------------------- -->
<dialog id="fenetre">
  <div id="fenetre-contenu"></div>
  <form method="dialog"><button class="discret">Fermer</button></form>
</dialog>

<div id="messages" aria-live="polite"></div>

<script src="/static/app.js?v={{ v_js }}"></script>
</body>
</html>
