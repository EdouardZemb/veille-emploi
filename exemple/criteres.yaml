# Ce qu'aucune lettre de Camille ne doit affirmer. La porte de validation cherche
# ces motifs mot pour mot dans chaque paragraphe, avant tout appel d'agent, et
# bloque l'envoi. Chaque règle a la même forme : une affirmation fausse qui
# survit à sa correction, et qu'un motif rattrape mieux qu'une relecture.
# `provenance` dit d'où vient la règle, pour remonter à la décision. Les motifs
# sont comparés sans accents ni casse.
affirmations_refusees:
  - libelle: "Niveau de certification ISTQB"
    valeur: "Ne jamais écrire qu'elle est certifiée ISTQB Advanced : elle a le niveau Foundation (CTFL), et n'a pas commencé l'Advanced."
    provenance: "exemple inventé — une lettre a promu sa certification d'un niveau"
    motifs:
      - "istqb advanced"
      - "certifiee istqb advanced"
      - "istqb test manager"
      - "ctal"
  - libelle: "Encadrement d'équipe"
    valeur: "Ne jamais écrire qu'elle a encadré ou managé une équipe : elle a coordonné une campagne de recette, sans diriger personne."
    provenance: "exemple inventé — coordonner n'est pas encadrer"
    motifs:
      - "j ai encadre une equipe"
      - "j ai manage une equipe"
      - "encadrement de testeurs"
      - "managed a team"
      - "led a team of"
      - "team leader depuis"
  - libelle: "Allemand courant"
    valeur: "Ne jamais écrire qu'elle parle allemand couramment : elle est au niveau A2, en cours d'apprentissage."
    provenance: "exemple inventé — profil, langues"
    motifs:
      - "allemand courant"
      - "allemand couramment"
      - "parle couramment allemand"
      - "fluent in german"
      - "fluent german"
      - "fliessend deutsch"
      - "verhandlungssicheres deutsch"
  - libelle: "Salaire actuel"
    valeur: "Ne jamais communiquer le salaire actuel : il ancre la négociation vers le bas."
    provenance: "exemple inventé — kit, section du salaire"
    motifs:
      - "mon salaire actuel est"
      - "je gagne actuellement"
      - "my current salary is"
      - "i currently earn"
      - "39 500 euros"
      - "39500 euros"
      - "39,5 k euros"

# La préparation d'entretien lit le fichier 17 du kit de Camille et retient les
# sections qui concernent l'annonce. Les questions posées à tout candidat (« avez-
# vous écrit ce code », le préavis, « pourquoi vous partez », le salaire, ses
# questions à eux, la liste d'avant chaque entretien) sont dans le code ; ici,
# celles que son parcours appelle, qui passent devant. `cle_section` : un
# fragment du titre de la section, sans accents ni ponctuation. Sans `motifs`, le
# point sort toujours ; sinon, la phrase de l'annonce qui porte le premier motif
# trouvé devient l'ancrage : du plus spécifique au plus général. `pays: ch` le
# réserve aux postes en Suisse.
entretien:
  declencheurs:
    - cle_section: "vous n avez jamais encadre d equipe"
      categorie: "attaque"
      pourquoi: "l'annonce demande d'encadrer : elle n'a encore mené aucune équipe"
