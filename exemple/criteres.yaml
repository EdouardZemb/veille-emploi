# ---------------------------------------------------------------------------
# Critères d'exemple : une personne inventée, Camille Exemple, testeuse
# logiciel autour de Mulhouse et de Bâle. Ce dossier sert de défaut au code, de
# modèle à copier pour une vraie configuration, et de jeu de référence aux tests.
#
# Aucune valeur de ce fichier ne décrit une vraie personne. Pour une instance
# réelle : copier ce dossier, le remplir, puis désigner le résultat par la
# variable VEILLE_CONFIG.
#
# Règle de lecture : tout `poids` est un nombre de points ajouté au score.
# Un critère `eliminatoire: true` met l'offre au rebut quel que soit le score.
# Les motifs sont comparés sans accents ni casse.
# ---------------------------------------------------------------------------

version: 1

profil:
  nom: "Camille Exemple"
  nom_fichier: "Camille-Exemple"
  poste_actuel: "Testeuse logiciel"
  employeur_actuel: "Entreprise Exemple SA"
  domicile: "Saint-Louis (Haut-Rhin)"
  langues:
    francais: "natif"
    anglais: "C1, pratiqué au travail"
    allemand: "A2, en cours d'apprentissage"
  certifications_verifiees:
    - "ISTQB CTFL (Foundation Level)"
  # Les atouts « pratiqués » (`outils_test`, `stack_pratiquee`) se tirent d'ici.
  stack:
    langages: ["Python", "Java", "Bash"]
    donnees: ["SQL", "MySQL"]
    systemes: ["Linux"]
    test: ["pytest", "Postman", "Appium", "JMeter", "SoapUI", "Behave"]
    gestion: ["TestRail", "Redmine"]

# Une offre reçoit une seule famille, celle qui rapporte le plus. `formule_cv`
# complète la phrase proposée pour le CV, « avec un intérêt particulier pour … »
# (« with a particular interest in … ») ; la `formule` d'un atout s'y ajoute.
#
# Camille automatise ses tests depuis trois ans : c'est sa première porte. La
# performance, qu'elle pratique avec JMeter, et le test fonctionnel suivent.
# Le pilotage l'attire, mais elle n'a encore mené aucune équipe : il reste en
# retrait, comme le développement pur.
