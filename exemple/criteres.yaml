eliminatoires:
  # L'automatisme industriel (automates, robots, convoyeurs, mise en service
  # sur site) est un autre métier, mais il emploie les mêmes mots que son
  # premier métier, l'automatisation des tests (« automatisation »,
  # « automation », « automaticien »), et les entrepôts de son domaine en
  # recrutent beaucoup. Du plus spécifique au plus général : un intitulé sans
  # ces mots n'est pas concerné ; un signal industriel sans ambiguïté dans
  # l'intitulé (`toujours_motifs`) écarte l'offre, même si une famille est
  # reconnue ; sinon, une famille attribuée ou un signal du logiciel
  # (`sauf_si`) la garde. « API » n'est pas un signal du logiciel ici : en
  # français, c'est aussi l'automate programmable industriel.
